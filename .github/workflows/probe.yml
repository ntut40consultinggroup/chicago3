name: probe-site
# 手動觸發：在 GitHub 的雲端主機上探測網站結構或執行下載測試。
# 結果推到 probe-results 分支（開發沙盒無法下載 artifact，但可以 git fetch）。
on:
  workflow_dispatch:
    inputs:
      command:
        description: "要執行的指令（在 repo 根目錄執行，輸出寫到 out/）"
        required: true
        default: "python tools/probe_site.py out https://www.ezmoney.com.tw/ETF 00981A"
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pandas openpyxl xlrd
      - run: mkdir -p out && ${{ inputs.command }} 2>&1 | tee out/_stdout.txt
      - name: push results to probe-results branch
        if: always()
        run: |
          find out -type f -size +2M -delete
          cd out
          git init -q -b probe-results
          git config user.name "probe-bot"
          git config user.email "probe-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "probe run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" probe-results
