name: daily-sync
# 每個交易日 18:35（台北）收盤資料齊了以後：快照 → 市值前 400 大個股（增量）→ 報酬指數 → 各基金持股，存到 Google Drive 的 chicago3.0。
# 需要的 secrets（repo Settings → Secrets and variables → Actions）：
#   GOOGLE_CLIENT_ID、GOOGLE_CLIENT_SECRET、GOOGLE_REFRESH_TOKEN（和 Streamlit Secrets 的 [google] 相同）
#   FINMIND_TOKEN（選填，有的話下載比較快）
# 沒有 Google secrets 時改存到執行機的暫存資料夾，只驗證下載程式能不能動。
on:
  schedule:
    - cron: "35 10 * * 1-5"      # UTC 10:35 = 台北 18:35
  workflow_dispatch:
    inputs:
      steps:
        description: "要執行的步驟"
        default: "snapshot,prices,tri,holdings"
permissions:
  contents: read
concurrency:
  group: daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 第一次（Drive 是空的）要抓兩年資料；免費 FinMind 有頻率上限，可能要 1–3 小時。每 50 檔存一次，中斷可續傳
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      STEPS: ${{ inputs.steps || 'snapshot,prices,tri,holdings' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: sync
        run: |
          if [ -z "$GOOGLE_REFRESH_TOKEN" ]; then
            echo "::warning::沒有設定 Google secrets，這次只存到暫存資料夾（不會寫入 Drive）"
            STORE=local:/tmp/chicago3.0
          else
            STORE=gdrive
          fi
          chicago3 sync --store "$STORE" --funds funds.yaml --steps "$STEPS"
