name: daily-sync
# 每個交易日 18:35（台北）收盤資料齊了以後：快照 → 市值前 400 大個股（增量）→ 報酬指數 → 各基金持股，存到 Google Drive 的 chicago3.0。
# 需要的 secrets（repo Settings → Secrets and variables → Actions）：
#   GOOGLE_CLIENT_ID、GOOGLE_CLIENT_SECRET、GOOGLE_REFRESH_TOKEN（和 Streamlit Secrets 的 [google] 相同）
#   FINMIND_TOKEN（選填，有的話下載比較快）
# 缺少 Google secrets 時立即失敗並列出缺哪一個（不會白跑）。
on:
  schedule:
    - cron: "35 10 * * 1-5"      # UTC 10:35 = 台北 18:35
  workflow_dispatch:
    inputs:
      steps:
        description: "要執行的步驟"
        default: "snapshot,tri,holdings,prices"
permissions:
  contents: read
concurrency:
  group: daily-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 350          # 第一次（Drive 是空的）要抓兩年資料；免費 FinMind 有頻率上限，可能要 1–3 小時。每 50 檔存一次，中斷可續傳
    env:
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
      FINMIND_TOKEN: ${{ secrets.FINMIND_TOKEN }}
      STEPS: ${{ inputs.steps || 'snapshot,tri,holdings,prices' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - name: check secrets
        run: |
          missing=""
          for k in GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET GOOGLE_REFRESH_TOKEN; do
            if [ -z "${!k}" ]; then missing="$missing $k"; fi
          done
          echo "FinMind token：$([ -n "$FINMIND_TOKEN" ] && echo 有 || echo 沒有)"
          if [ -n "$missing" ]; then
            echo "::error title=缺少 secrets::workflow 讀不到：$missing。請到 Settings → Secrets and variables → Actions → Repository secrets 新增（名稱要完全相同，不是 Variables、也不是 Environment secrets）"
            exit 1
          fi
          echo "::notice title=secrets 檢查::三個 Google secrets 都讀得到"
      - name: sync
        run: chicago3 sync --store gdrive --funds funds.yaml --steps "$STEPS"
