[project]
name = "chicago3"
version = "0.0.1"
description = "Chicago 3.0：股票基金的策略性資產配置（Black–Litterman＋追蹤誤差最佳化）"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "scikit-learn>=1.4",
  "cvxpy>=1.5",
  "openpyxl>=3.1",
  "requests>=2.31",
  "pydantic>=2.5",
  "pyyaml>=6",
  "matplotlib>=3.8",
  "pyarrow>=14",
]

[project.scripts]
chicago3 = "chicago3.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chicago3*"]
[tool.pytest.ini_options]
pythonpath = ["tests"]
